<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Two Truths One Lie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Social bluff game</p>
        <h1>Two Truths One Lie</h1>
        <p class="subtitle">Create a round, challenge other players, and see how many lies you can spot.</p>
      </div>
      <div class="score-card" id="scoreCard">
        <span class="score-label">Your score</span>
        <div class="score-values">
          <strong id="correctCount">0</strong>
          <span>/</span>
          <strong id="totalCount">0</strong>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="panel composer-panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">Create a round</p>
            <h2>Enter 3 statements</h2>
          </div>
          <span class="pill">Saved to Supabase</span>
        </div>

        <form id="roundForm" class="round-form">
          <label class="field">
            <span>Statement 1</span>
            <textarea id="statementOne" rows="3" maxlength="180" placeholder="I have visited 12 countries."></textarea>
          </label>
          <label class="field">
            <span>Statement 2</span>
            <textarea id="statementTwo" rows="3" maxlength="180" placeholder="I can solve a Rubik's Cube in under a minute."></textarea>
          </label>
          <label class="field">
            <span>Statement 3</span>
            <textarea id="statementThree" rows="3" maxlength="180" placeholder="I have never eaten pizza."></textarea>
          </label>

          <fieldset class="lie-picker">
            <legend>Which one is the lie?</legend>
            <label class="radio-card"><input type="radio" name="lieIndex" value="0" checked><span>Statement 1</span></label>
            <label class="radio-card"><input type="radio" name="lieIndex" value="1"><span>Statement 2</span></label>
            <label class="radio-card"><input type="radio" name="lieIndex" value="2"><span>Statement 3</span></label>
          </fieldset>

          <button class="primary-btn" type="submit" id="submitBtn">Submit round</button>
        </form>

        <div class="status-message" id="formStatus" aria-live="polite"></div>
      </section>

      <section class="panel game-panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">Game feed</p>
            <h2>Guess the lie</h2>
          </div>
          <button class="ghost-btn" id="refreshBtn" type="button">Refresh</button>
        </div>

        <div class="status-inline" id="gameStatus">Loading rounds...</div>
        <div class="cards-grid" id="roundsContainer"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js" crossorigin="anonymous"></script>
</body>
</html>
